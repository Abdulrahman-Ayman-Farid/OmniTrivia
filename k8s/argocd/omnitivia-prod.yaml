apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omnitivia-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdulrahman-Ayman-Farid/OmniTrivia.git
    path: k8s/overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: omnitivia-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
