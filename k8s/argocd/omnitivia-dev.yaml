apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omnitivia-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdulrahman-Ayman-Farid/OmniTrivia.git
    path: k8s/overlays/dev
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: omnitivia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
