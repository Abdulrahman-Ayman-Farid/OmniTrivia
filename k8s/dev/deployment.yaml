# NOTE: The image tag below should be updated by CI/CD (e.g., replaced with the
# commit SHA or semantic version from the pipeline). Do not rely on :latest in
# production-like environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnitrivia-dev
  namespace: omnitrivia-dev
  labels:
    app: omnitrivia
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: omnitrivia
      environment: dev
  template:
    metadata:
      labels:
        app: omnitrivia
        environment: dev
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: omnitrivia
          image: omnitrivia:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: omnitrivia-dev-config
            - secretRef:
                name: omnitrivia-dev-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
