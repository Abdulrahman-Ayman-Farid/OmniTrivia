apiVersion: v1
kind: Secret
metadata:
  name: omnitrivia-dev-secrets
  namespace: omnitrivia-dev
  labels:
    app: omnitrivia
    environment: dev
type: Opaque
# Replace with actual base64-encoded value: echo -n 'your-key' | base64
data:
  GEMINI_API_KEY: REPLACE_WITH_BASE64_ENCODED_GEMINI_API_KEY
