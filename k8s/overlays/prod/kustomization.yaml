apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnitivia-prod
resources:
  - ../../base
  - hpa.yaml
images:
  - name: omnitivia
    newTag: prod
patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: omnitivia
