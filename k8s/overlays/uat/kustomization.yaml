apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnitivia-uat
resources:
  - ../../base
images:
  - name: omnitivia
    newTag: uat
patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: omnitivia
