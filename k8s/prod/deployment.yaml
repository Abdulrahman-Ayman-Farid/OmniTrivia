# OmniTrivia PROD Deployment
# NOTE: The image tag below should be updated by CI/CD (e.g. ArgoCD, GitHub Actions)
#       to the specific commit SHA or semantic version being deployed.
#       Do NOT rely on :latest in a real production pipeline.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnitrivia-prod
  namespace: omnitrivia-prod
  labels:
    app: omnitrivia
    environment: prod
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: omnitrivia
      environment: prod
  template:
    metadata:
      labels:
        app: omnitrivia
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: omnitrivia
          image: omnitrivia:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: omnitrivia-prod-config
            - secretRef:
                name: omnitrivia-prod-secrets
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omnitrivia-prod-pdb
  namespace: omnitrivia-prod
  labels:
    app: omnitrivia
    environment: prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: omnitrivia
      environment: prod
