apiVersion: v1
kind: Secret
metadata:
  name: omnitrivia-prod-secrets
  namespace: omnitrivia-prod
  labels:
    app: omnitrivia
    environment: prod
type: Opaque
# Replace with actual base64-encoded value: echo -n 'your-key' | base64
data:
  GEMINI_API_KEY: REPLACE_WITH_BASE64_ENCODED_GEMINI_API_KEY
