apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnitivia-ecr-pull
  labels:
    app: omnitivia
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ecr-pull-check
              image: omnitivia:latest
              command: ["sh", "-c", "echo 'ECR image pull verified' && exit 0"]
