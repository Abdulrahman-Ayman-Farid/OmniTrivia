name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (lint)
        run: bun run tsc --noEmit

      - name: Build frontend
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist/ directory not found after build"
            exit 1
          fi
          echo "Build output verified: dist/ exists"

      - name: Build Docker image
        run: |
          docker build -t omnitivia:${{ github.sha }} .
          echo "Docker image built successfully: omnitivia:${{ github.sha }}"

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'omnitivia:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run dependency audit
        run: |
          bun audit || echo "WARNING: Dependency audit found issues (non-blocking)"

      - name: Login to Docker registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag omnitivia:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/omnitivia:${{ github.sha }}
          docker tag omnitivia:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/omnitivia:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/omnitivia:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/omnitivia:latest
          echo "Docker image pushed to registry"
