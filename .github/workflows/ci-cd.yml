name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository }}:${{ github.sha }}"

  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build-push
    if: needs.docker-build-push.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Set image environment variable
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Update image tag in dev deployment
        run: |
          sed -i "s|image: omnitrivia:latest|image: ${IMAGE}|g" k8s/dev/deployment.yaml

      - name: Apply dev manifests
        run: kubectl apply -f k8s/dev/ --namespace=omnitrivia-dev

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/omnitrivia-dev -n omnitrivia-dev --timeout=180s

  deploy-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build-push
    if: needs.docker-build-push.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Set image environment variable
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Update image tag in uat deployment
        run: |
          sed -i "s|image: omnitrivia:latest|image: ${IMAGE}|g" k8s/uat/deployment.yaml

      - name: Apply uat manifests
        run: kubectl apply -f k8s/uat/ --namespace=omnitrivia-uat

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/omnitrivia-uat -n omnitrivia-uat --timeout=180s

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build-push
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docker-build-push.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Set image environment variable
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Update image tag in prod deployment
        run: |
          sed -i "s|image: omnitrivia:latest|image: ${IMAGE}|g" k8s/prod/deployment.yaml

      - name: Apply prod manifests
        run: kubectl apply -f k8s/prod/ --namespace=omnitrivia-prod

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/omnitrivia-prod -n omnitrivia-prod --timeout=180s
